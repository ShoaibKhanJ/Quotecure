<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Cure — Words That Heal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#" class="logo">Quote Cure</a>
      <div class="nav-actions">
        <button class="nav-btn" id="favToggle" aria-label="Favorites">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          <span class="fav-count" id="favCount">0</span>
        </button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== HERO / QUOTE OF THE DAY ===== -->
  <header class="hero" id="hero">
    <div class="hero-content">
      <span class="hero-label">Quote of the Day</span>
      <blockquote class="hero-quote" id="heroQuote"></blockquote>
      <cite class="hero-author" id="heroAuthor"></cite>
    </div>
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>
  </header>

  <!-- ===== SEARCH BAR ===== -->
  <section class="search-section">
    <div class="container">
      <div class="search-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by keyword, author, vibe, or theme..." autocomplete="off">
        <button class="search-clear" id="searchClear" aria-label="Clear search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== FILTER TABS ===== -->
  <section class="filters-section">
    <div class="container">
      <!-- Filter Type Toggle -->
      <div class="filter-type-toggle">
        <button class="filter-type-btn active" data-filter-type="vibe">Vibe</button>
        <button class="filter-type-btn" data-filter-type="theme">Theme</button>
        <button class="filter-type-btn" data-filter-type="author">Author</button>
      </div>

      <!-- Filter Options (dynamic) -->
      <div class="filter-options" id="filterOptions">
        <!-- Populated by JS -->
      </div>

      <!-- Active filter info -->
      <div class="active-filter-info" id="activeFilterInfo">
        <span id="activeFilterText"></span>
        <button class="clear-filter-btn" id="clearFilterBtn">Show All</button>
      </div>
    </div>
  </section>

  <!-- ===== QUOTES GRID ===== -->
  <main class="quotes-section">
    <div class="container">
      <div class="quotes-grid" id="quotesGrid">
        <!-- Rendered by JS -->
      </div>
      <div class="no-results" id="noResults" style="display:none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <p>No quotes found</p>
        <span>Try a different search or filter</span>
      </div>
    </div>
  </main>

  <!-- ===== FAVORITES PANEL (overlay) ===== -->
  <div class="fav-overlay" id="favOverlay"></div>
  <aside class="fav-panel" id="favPanel">
    <div class="fav-panel-header">
      <h2>Saved Quotes</h2>
      <button class="fav-panel-close" id="favPanelClose" aria-label="Close favorites">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="fav-panel-list" id="favPanelList">
      <!-- Rendered by JS -->
    </div>
    <div class="fav-empty" id="favEmpty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      <p>No saved quotes yet</p>
      <span>Click the heart icon on any quote to save it</span>
    </div>
  </aside>

  <!-- ===== TOAST NOTIFICATION ===== -->
  <div class="toast" id="toast">
    <span id="toastMsg"></span>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container">
      <p class="footer-brand">Quote Cure</p>
      <p class="footer-tagline">Words that heal, uplift, and inspire</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
